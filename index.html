<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rock+Salt&display=swap" rel="stylesheet">
    <title>Bit Of The Day</title>
</head>

<body class="h-dvh w-full touch-manipulation overflow-hidden overscroll-none bg-zinc-950 text-white">
    <div class="fixed inset-0 grid h-dvh w-full grid-rows-[42%_58%] text-center md:grid-rows-[45%_55%]">
        <h1 class="w-full self-end px-4 pb-5 font-[Rock_Salt,cursive] text-6xl font-bold md:pb-8 md:text-9xl leading-[1.75]">Bit Of The Day</h1>
        <h2 id="botd" class="flex h-full w-full items-center justify-center self-start px-[12%] text-[clamp(1.75rem,8vw,2.25rem)] font-[Patrick_Hand,cursive] font-normal uppercase leading-[1.15] text-amber-300 md:px-24 md:text-6xl"></h2>
    </div>
    <button id="left-arrow" type="button" onclick="left()" aria-label="Previous day" class="fixed bottom-[max(1.25rem,env(safe-area-inset-bottom))] left-[max(1.25rem,env(safe-area-inset-left))] flex h-14 w-14 cursor-pointer items-center justify-center border-0 bg-transparent p-0 font-[Rock_Salt,cursive] text-4xl leading-none opacity-50 md:bottom-1/2 md:left-10 md:translate-y-1/2 md:text-8xl"><</button>
    <button id="right-arrow" type="button" onclick="right()" aria-label="Next day" class="fixed bottom-[max(1.25rem,env(safe-area-inset-bottom))] right-[max(1.25rem,env(safe-area-inset-right))] flex hidden h-14 w-14 cursor-pointer items-center justify-center border-0 bg-transparent p-0 font-[Rock_Salt,cursive] text-4xl leading-none opacity-50 md:bottom-1/2 md:right-10 md:translate-y-1/2 md:text-8xl">></button>
    
    
    <script>
        let fetchedData;
        let d = new Date();
        fetch('Bits.json')
            .then(response => response.json())
            .then(data => {
                fetchedData = data;
                const today = new Date().toISOString().split('T')[0];
                try {
                    const bit = data[today];
                    if (bit) {
                        document.getElementById('botd').innerHTML = bit;
                    }
                } catch (error) {
                    console.error('Error fetching bit of the day:', error);
                }
            });

        function left() {
            d.setDate(d.getDate() - 1);
            let bit = fetchedData[d.toISOString().split('T')[0]];
            bit && (document.getElementById('botd').innerHTML = bit);

            let d1 = new Date(d);
            d1.setDate(d1.getDate() - 1);
            if (d1.toISOString().split('T')[0] in fetchedData) {
                document.getElementById('left-arrow').classList.remove('hidden');
            } else {
                document.getElementById('left-arrow').classList.add('hidden');
                document.getElementById('right-arrow').classList.remove('hidden'); 
            }
        }

        function right() {
            d.setDate(d.getDate() + 1);
            let bit = fetchedData[d.toISOString().split('T')[0]];
            bit && (document.getElementById('botd').innerHTML = bit);

            let d1 = new Date(d);
            d1.setDate(d1.getDate() + 1);
            if (d1.toISOString().split('T')[0] in fetchedData) {
                document.getElementById('right-arrow').classList.remove('hidden');
            } else {
                document.getElementById('right-arrow').classList.add('hidden');
                document.getElementById('left-arrow').classList.remove('hidden');
                
            }

        }
    </script>
</body>
</html>
