<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rock+Salt&display=swap" rel="stylesheet">
    <title>Bit Of The Day</title>
</head>

<body class="h-dvh w-full touch-manipulation overflow-hidden overscroll-none bg-zinc-950 text-white">
    <main class="fixed inset-0 grid h-dvh grid-rows-[42%_58%] px-4 text-center md:grid-rows-[45%_55%]">
        <h1 class="
            self-end pb-5
            font-[Rock_Salt,cursive] text-4xl leading-normal font-bold
            md:pb-8 md:text-9xl
        ">
            Bit Of The Day
        </h1>
        <h2 id="botd" class="
            flex h-full items-center justify-center self-start px-10 pb-16
            font-[Patrick_Hand,cursive] text-3xl leading-tight uppercase text-amber-300
            md:px-32 md:pb-24 md:text-6xl
        "></h2>
    </main>

    <button
        id="left-arrow"
        type="button"
        onclick="left()"
        aria-label="Previous day"
        class="
            fixed bottom-5 left-5 flex h-14 w-14 items-center justify-center
            border-0 bg-transparent p-0
            font-[Rock_Salt,cursive] text-4xl opacity-50
            md:top-1/2 md:left-10 md:bottom-auto md:-translate-y-1/2 md:text-8xl
            hidden
        "
    >&lt;</button>

    <button
        id="right-arrow"
        type="button"
        onclick="right()"
        aria-label="Next day"
        class="
            fixed bottom-5 right-5 flex h-14 w-14 items-center justify-center
            border-0 bg-transparent p-0
            font-[Rock_Salt,cursive] text-4xl opacity-50
            md:top-1/2 md:right-10 md:bottom-auto md:-translate-y-1/2 md:text-8xl
            hidden
        "
    >&gt;</button>

    <a
        href="https://www.icloud.com/shortcuts/4bff3e281b494baf9a3d74e2ddb62ae5"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Add iOS Shortcut"
        class="fixed bottom-7 left-1/2 z-10 flex h-14 w-14 -translate-x-1/2 items-center justify-center border-0 bg-transparent p-0 text-white/50 md:bottom-7"
        >
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9.853 14.633l-6.201-3.946a2 2 0 0 1 0-3.374l6.2-3.946a4 4 0 0 1 4.296 0l6.2 3.946a2 2 0 0 1 0 3.374l-6.2 3.946a4 4 0 0 1-4.296 0Z"/><path d="m18.286 12l2.063 1.313a2 2 0 0 1 0 3.374l-6.201 3.946a4 4 0 0 1-4.296 0l-6.2-3.946a2 2 0 0 1 0-3.374L5.714 12"/></g></svg>
    </a>
    
    
    <script>
        let fetchedData;
        let d = new Date();

        function dateKey(date) {
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/Los_Angeles'
            }).format(date);
        }

        function todayKey() {
            return dateKey(new Date());
        }

        function updateArrows() {
            if (!fetchedData) return;

            const previousDay = new Date(d);
            previousDay.setUTCDate(previousDay.getUTCDate() - 1);
            document.getElementById('left-arrow').classList.toggle(
                'hidden',
                !(dateKey(previousDay) in fetchedData)
            );

            const nextDay = new Date(d);
            nextDay.setUTCDate(nextDay.getUTCDate() + 1);
            document.getElementById('right-arrow').classList.toggle(
                'hidden',
                dateKey(nextDay) > todayKey() || !(dateKey(nextDay) in fetchedData)
            );
        }

        fetch('Bits.json')
            .then(response => response.json())
            .then(data => {
                fetchedData = data;
                d = new Date(todayKey() + 'T12:00:00Z');
                const today = todayKey();
                updateArrows();
                try {
                    const bit = data[today];
                    if (bit) {
                        document.getElementById('botd').innerHTML = bit;
                    }
                } catch (error) {
                    console.error('Error fetching bit of the day:', error);
                }
            });

        function left() {
            if (!fetchedData) return;

            d.setUTCDate(d.getUTCDate() - 1);
            let bit = fetchedData[dateKey(d)];
            if (!bit) {
                d.setUTCDate(d.getUTCDate() + 1);
                updateArrows();
                return;
            }
            document.getElementById('botd').innerHTML = bit;
            updateArrows();
        }

        function right() {
            if (!fetchedData) return;

            const nextDay = new Date(d);
            nextDay.setUTCDate(nextDay.getUTCDate() + 1);
            if (dateKey(nextDay) > todayKey() || !(dateKey(nextDay) in fetchedData)) return;

            d.setUTCDate(d.getUTCDate() + 1);
            let bit = fetchedData[dateKey(d)];
            if (bit) document.getElementById('botd').innerHTML = bit;
            updateArrows();
        }
    </script>
</body>
</html>
