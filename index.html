<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rock+Salt&display=swap" rel="stylesheet">
    <title>Bit Of The Day</title>
</head>

<body class="h-dvh w-full touch-manipulation overflow-hidden overscroll-none bg-zinc-950 text-white">
    <main class="fixed inset-0 grid h-dvh grid-rows-[42%_58%] px-4 text-center md:grid-rows-[45%_55%]">
        <h1 class="
            self-end pb-5
            font-[Rock_Salt,cursive] text-4xl leading-normal font-bold
            md:pb-8 md:text-9xl
        ">
            Bit Of The Day
        </h1>
        <h2 id="botd" class="
            flex h-full items-center justify-center self-start px-10 pb-16
            font-[Patrick_Hand,cursive] text-3xl leading-tight uppercase text-amber-300
            md:px-32 md:pb-24 md:text-6xl
        "></h2>
    </main>

    <button
        id="left-arrow"
        type="button"
        onclick="left()"
        aria-label="Previous day"
        class="
            fixed bottom-5 left-5 flex h-14 w-14 items-center justify-center
            border-0 bg-transparent p-0
            font-[Rock_Salt,cursive] text-4xl opacity-50
            md:top-1/2 md:left-10 md:bottom-auto md:-translate-y-1/2 md:text-8xl
            hidden
        "
    >&lt;</button>

    <button
        id="right-arrow"
        type="button"
        onclick="right()"
        aria-label="Next day"
        class="
            fixed bottom-5 right-5 flex h-14 w-14 items-center justify-center
            border-0 bg-transparent p-0
            font-[Rock_Salt,cursive] text-4xl opacity-50
            md:top-1/2 md:right-10 md:bottom-auto md:-translate-y-1/2 md:text-8xl
            hidden
        "
    >&gt;</button>
    
    
    <script>
        let fetchedData;
        let d = new Date();

        function dateKey(date) {
            return date.toISOString().split('T')[0];
        }

        function todayKey() {
            return dateKey(new Date());
        }

        function updateArrows() {
            if (!fetchedData) return;

            const previousDay = new Date(d);
            previousDay.setDate(previousDay.getDate() - 1);
            document.getElementById('left-arrow').classList.toggle(
                'hidden',
                !(dateKey(previousDay) in fetchedData)
            );

            const nextDay = new Date(d);
            nextDay.setDate(nextDay.getDate() + 1);
            document.getElementById('right-arrow').classList.toggle(
                'hidden',
                dateKey(nextDay) > todayKey() || !(dateKey(nextDay) in fetchedData)
            );
        }

        fetch('Bits.json')
            .then(response => response.json())
            .then(data => {
                fetchedData = data;
                d = new Date(todayKey() + 'T00:00:00');
                const today = todayKey();
                updateArrows();
                try {
                    const bit = data[today];
                    if (bit) {
                        document.getElementById('botd').innerHTML = bit;
                    }
                } catch (error) {
                    console.error('Error fetching bit of the day:', error);
                }
            });

        function left() {
            if (!fetchedData) return;

            d.setDate(d.getDate() - 1);
            let bit = fetchedData[d.toISOString().split('T')[0]];
            if (!bit) {
                d.setDate(d.getDate() + 1);
                updateArrows();
                return;
            }
            bit && (document.getElementById('botd').innerHTML = bit);
            updateArrows();
        }

        function right() {
            if (!fetchedData) return;

            const nextDay = new Date(d);
            nextDay.setDate(nextDay.getDate() + 1);
            if (dateKey(nextDay) > todayKey() || !(dateKey(nextDay) in fetchedData)) return;

            d.setDate(d.getDate() + 1);
            let bit = fetchedData[d.toISOString().split('T')[0]];
            bit && (document.getElementById('botd').innerHTML = bit);
            updateArrows();
        }
    </script>
</body>
</html>
